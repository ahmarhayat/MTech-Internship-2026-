<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Error-First Async UI</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .card { background: white; padding: 2rem; border-radius: 12px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    
    /* Loading Spinner */
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #028090; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .error-box { background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 6px; text-align: center; }
    button { background: #991b1b; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; margin-top: 0.5rem; font-weight: bold; }
    
    ul { padding-left: 1.2rem; }
    li { margin-bottom: 0.5rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Error-First Data Fetcher</h2>
    
    <!-- State 1: Loading Spinner -->
    <div id="loadingState" style="display: none;">
      <div class="spinner"></div>
      <p style="text-align: center; color: #64748b;">Fetching records...</p>
    </div>

    <!-- State 2: Success List -->
    <div id="successState" style="display: none;">
      <h4 style="color: #166534;">Data Loaded Successfully:</h4>
      <ul id="itemList"></ul>
    </div>

    <!-- State 3: Error & Retry Button -->
    <div id="errorState" style="display: none;" class="error-box">
      <p>⚠️ Network error: Failed to fetch data.</p>
      <button onclick="loadData()">Retry Connection</button>
    </div>
  </div>

  <script>
    async function loadData() {
      const loading = document.getElementById('loadingState');
      const success = document.getElementById('successState');
      const error = document.getElementById('errorState');
      const list = document.getElementById('itemList');

      // 1. Show Loading State
      loading.style.display = 'block';
      success.style.display = 'none';
      error.style.display = 'none';

      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=4');
        if (!response.ok) throw new Error('HTTP error ' + response.status);
        
        const data = await response.json();
        
        // Render Success List
        list.innerHTML = data.map(item => `<li><strong>${item.title}</strong></li>`).join('');
        
        // 2. Show Success State
        loading.style.display = 'none';
        success.style.display = 'block';
      } catch (err) {
        // 3. Show Error State
        loading.style.display = 'none';
        error.style.display = 'block';
      }
    }

    loadData();
  </script>

</body>
</html>
