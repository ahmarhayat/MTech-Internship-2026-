<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User Directory</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 2rem; }
    .title { text-align: center; color: #1e293b; margin-bottom: 2rem; }
    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    .user-card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }
    .user-card img { border-radius: 50%; width: 90px; height: 90px; margin-bottom: 0.8rem; }
    .user-card h3 { font-size: 1.1rem; color: #028090; margin: 0.3rem 0; }
    .user-card p { font-size: 0.9rem; color: #64748b; margin: 0; }
    .btn-container { text-align: center; margin-top: 2rem; }
    button {
      background-color: #028090;
      color: white;
      padding: 0.8rem 1.8rem;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background-color: #015c68; }
  </style>
</head>
<body>

  <h2 class="title">Random User Directory</h2>
  <div id="userGrid" class="user-grid"></div>

  <div class="btn-container">
    <button id="loadBtn" onclick="fetchUsers()">Load More Users</button>
  </div>

  <script>
    async function fetchUsers() {
      const btn = document.getElementById('loadBtn');
      btn.innerText = 'Loading...';
      
      try {
        const response = await fetch('https://randomuser.me/api/?results=8');
        const data = await response.json();
        
        const grid = document.getElementById('userGrid');
        
        data.results.forEach(user => {
          const card = document.createElement('div');
          card.className = 'user-card';
          card.innerHTML = `
            <img src="${user.picture.large}" alt="${user.name.first}">
            <h3>${user.name.first} ${user.name.last}</h3>
            <p>📍 ${user.location.country}</p>
          `;
          grid.appendChild(card);
        });
      } catch (error) {
        alert('Failed to load users.');
      } finally {
        btn.innerText = 'Load More Users';
      }
    }

    // Initial Load
    fetchUsers();
  </script>

</body>
</html>
