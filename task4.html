<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4: React.lazy + Suspense in HTML</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 30px; font-family: sans-serif; background: #f8f9fa;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, lazy, Suspense } = React;

    // Simulate an external bundle module delay for React.lazy
    const HeavyAnalyticsChart = lazy(() => {
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve({
            default: () => (
              <div style={{
                background: '#e0f2fe',
                border: '2px solid #0284c7',
                padding: '20px',
                borderRadius: '8px',
                marginTop: '15px'
              }}>
                <h3 style={{ margin: '0 0 10px 0', color: '#0369a1' }}>Analytics Chart Loaded</h3>
                <p style={{ margin: 0 }}>This heavy visualization module was loaded on demand via React.lazy and Suspense!</p>
              </div>
            )
          });
        }, 1800); // 1.8 second simulated network load time
      });
    });

    function App() {
      const [loadChart, setLoadChart] = useState(false);

      return (
        <div style={{ maxWidth: '600px', margin: '0 auto', background: '#fff', padding: '25px', borderRadius: '8px', boxShadow: '0 2px 8px rgba(0,0,0,0.1)' }}>
          <h2>Company Dashboard</h2>
          <p>Clicking the button dynamically fetches the heavy component bundle:</p>
          
          <button 
            onClick={() => setLoadChart(true)}
            style={{
              padding: '10px 18px',
              background: '#028090',
              color: '#fff',
              border: 'none',
              borderRadius: '4px',
              cursor: 'pointer',
              fontWeight: 'bold'
            }}
          >
            Load Heavy Analytics Chart
          </button>

          {loadChart && (
            <Suspense fallback={
              <div style={{ marginTop: '20px', padding: '15px', background: '#fffbe3', border: '1px solid #ffe066', borderRadius: '6px' }}>
                ⏳ Fetching dynamic component chunk over network...
              </div>
            }>
              <HeavyAnalyticsChart />
            </Suspense>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
