<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Tech Task Manager - JS Essentials</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>M-Tech Task Manager</h1>
        <p>Lab 2.4: JavaScript Essentials</p>
    </header>

    <main>
        <section class="task-input">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button id="addBtn">Add Task</button>
        </section>

        <section class="tasks">
            <h2>My Tasks</h2>
            <ul id="taskList">
                <!-- Tasks will be added here by JavaScript -->
            </ul>
        </section>
    </main>

    <footer>
        <p>© 2026 M-Tech Production & Marketing</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
