<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2: E-Commerce Cart Demo</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 20px; font-family: sans-serif;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Lightweight Zustand-style state store pattern
    const PRODUCTS = [
      { id: 101, name: 'Wireless Headphones', price: 99 },
      { id: 102, name: 'Mechanical Keyboard', price: 120 },
      { id: 103, name: 'Gaming Mouse', price: 50 },
    ];

    function App() {
      const [cart, setCart] = useState([]);

      const addToCart = (product) => {
        setCart((prevCart) => {
          const existingIndex = prevCart.findIndex((item) => item.id === product.id);
          if (existingIndex > -1) {
            const updated = [...prevCart];
            updated[existingIndex].quantity += 1;
            return updated;
          }
          return [...prevCart, { ...product, quantity: 1 }];
        });
      };

      const removeFromCart = (productId) => {
        setCart((prevCart) => prevCart.filter((item) => item.id !== productId));
      };

      const getTotalPrice = () => {
        return cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      };

      return (
        <div style={{ maxWidth: '700px', margin: '0 auto' }}>
          <h1>Shop Products</h1>
          
          <div style={{ display: 'flex', gap: '1rem', marginBottom: '2rem' }}>
            {PRODUCTS.map((product) => (
              <div key={product.id} style={{ border: '1px solid #ccc', padding: '1rem', borderRadius: '6px', flex: 1 }}>
                <h3>{product.name}</h3>
                <p>Price: ${product.price}</p>
                <button 
                  onClick={() => addToCart(product)}
                  style={{ background: '#028090', color: '#fff', border: 'none', padding: '8px 12px', borderRadius: '4px', cursor: 'pointer' }}
                >
                  Add to Cart
                </button>
              </div>
            ))}
          </div>

          <hr />

          <h2>Shopping Cart</h2>
          {cart.length === 0 ? (
            <p>Your cart is empty.</p>
          ) : (
            <div>
              <ul style={{ paddingLeft: '20px' }}>
                {cart.map((item) => (
                  <li key={item.id} style={{ margin: '0.5rem 0' }}>
                    <strong>{item.name}</strong> - ${item.price} x {item.quantity}{' '}
                    <button 
                      onClick={() => removeFromCart(item.id)}
                      style={{ background: '#e63946', color: '#fff', border: 'none', padding: '4px 8px', borderRadius: '4px', cursor: 'pointer', marginLeft: '10px' }}
                    >
                      Remove
                    </button>
                  </li>
                ))}
              </ul>
              <h3>Total Price: ${getTotalPrice()}</h3>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
