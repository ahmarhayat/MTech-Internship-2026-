<!DOCTYPE html>
<html>
<head>
  <title>Todo List App</title>
</head>
<body>
  <h2>1. Todo List App</h2>
  <input type="text" id="todo-input" placeholder="Enter todo item..." />
  <button id="add-btn">Add</button>
  <ul id="todo-list" style="list-style: none; padding: 0;"></ul>

  <script>
    let todos = [];

    const todoInput = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const todoList = document.getElementById('todo-list');

    function renderTodos() {
      // Map state array into HTML list items
      todoList.innerHTML = todos.map((todo, index) => `
        <li style="margin-bottom: 8px;">
          <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleComplete(${index})">
          <span style="text-decoration: ${todo.completed ? 'line-through' : 'none'}; margin: 0 10px;">
            ${todo.text}
          </span>
          <button onclick="deleteTodo(${index})">Delete</button>
        </li>
      `).join('');
    }

    addBtn.addEventListener('click', () => {
      const text = todoInput.value.trim();
      if (text) {
        todos.push({ text: text, completed: false });
        todoInput.value = '';
        renderTodos();
      }
    });

    function toggleComplete(index) {
      todos[index].completed = !todos[index].completed;
      renderTodos();
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      renderTodos();
    }
  </script>
</body>
</html>
