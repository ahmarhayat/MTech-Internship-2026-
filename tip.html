<!DOCTYPE html>
<html>
<head>
  <title>Tip Calculator</title>
</head>
<body>
  <h2>2. Tip Calculator</h2>
  <label for="bill">Bill Amount ($): </label>
  <input type="number" id="bill" value="0" min="0" step="any"><br><br>

  <label>Tip Percentage: </label>
  <button onclick="calculateTip(10)">10%</button>
  <button onclick="calculateTip(15)">15%</button>
  <button onclick="calculateTip(20)">20%</button>

  <div style="margin-top: 15px;">
    <p>Tip Amount: $<span id="tip-amount">0.00</span></p>
    <p>Total Bill: $<span id="total-amount">0.00</span></p>
  </div>

  <script>
    function calculateTip(percentage) {
      const bill = parseFloat(document.getElementById('bill').value) || 0;
      const tip = bill * (percentage / 100);
      const total = bill + tip;

      document.getElementById('tip-amount').innerText = tip.toFixed(2);
      document.getElementById('total-amount').innerText = total.toFixed(2);
    }
  </script>
</body>
</html>
