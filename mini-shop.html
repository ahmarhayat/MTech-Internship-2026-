<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Shop</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #fafafa; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .card { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; }
    .card a { display: inline-block; margin-top: 10px; background: #028090; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; }
    .btn-back { background: #555; color: white; padding: 8px 14px; text-decoration: none; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Product Listing View -->
  <div id="listing-view">
    <h1>Product Catalog</h1>
    <div class="grid" id="product-list"></div>
  </div>

  <!-- Dynamic Product Detail View -->
  <div id="detail-view" class="hidden">
    <a href="#products" class="btn-back">&larr; Back to products</a>
    <div id="detail-content" class="card"></div>
  </div>

  <script>
    const products = [
      { id: 1, name: "Wireless Headphones", price: "$99", desc: "Noise-canceling over-ear headphones." },
      { id: 2, name: "Mechanical Keyboard", price: "$120", desc: "RGB tactile mechanical switch keyboard." },
      { id: 3, name: "Gaming Mouse", price: "$50", desc: "High-precision 16000 DPI optical sensor." }
    ];

    function renderShop() {
      const hash = window.location.hash || '#products';
      const listingView = document.getElementById('listing-view');
      const detailView = document.getElementById('detail-view');

      if (hash.startsWith('#product/')) {
        const id = parseInt(hash.split('/')[1]);
        const product = products.find(p => p.id === id);

        if (product) {
          listingView.classList.add('hidden');
          detailView.classList.remove('hidden');
          document.getElementById('detail-content').innerHTML = `
            <h2>${product.name}</h2>
            <h3>${product.price}</h3>
            <p>${product.desc}</p>
          `;
        } else {
          document.getElementById('detail-content').innerHTML = `<h2>Product Not Found</h2>`;
        }
      } else {
        detailView.classList.add('hidden');
        listingView.classList.remove('hidden');
        
        const listContainer = document.getElementById('product-list');
        listContainer.innerHTML = products.map(p => `
          <div class="card">
            <h3>${p.name}</h3>
            <p>${p.price}</p>
            <a href="#product/${p.id}">View Details</a>
          </div>
        `).join('');
      }
    }

    window.addEventListener('hashchange', renderShop);
    window.addEventListener('load', renderShop);
  </script>
</body>
</html>
