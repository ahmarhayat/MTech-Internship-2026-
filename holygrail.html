<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holy Grail Layout (CSS Grid)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    /* Grid Layout Container */
    .grid-container {
      display: grid;
      min-height: 100vh;
      grid-template-rows: 80px 1fr 60px;
      grid-template-columns: 200px 1fr 200px;
      
      /* Defining Grid Template Areas */
      grid-template-areas:
        "header header  header"
        "nav    main    aside"
        "footer footer  footer";
      gap: 10px;
      background-color: #e5e7eb;
      padding: 10px;
    }

    /* Assigning Areas */
    header {
      grid-area: header;
      background-color: #028090;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 6px;
    }

    nav {
      grid-area: nav;
      background-color: #ffffff;
      padding: 1rem;
      border-radius: 6px;
    }

    main {
      grid-area: main;
      background-color: #ffffff;
      padding: 1.5rem;
      border-radius: 6px;
    }

    aside {
      grid-area: aside;
      background-color: #ffffff;
      padding: 1rem;
      border-radius: 6px;
    }

    footer {
      grid-area: footer;
      background-color: #1f2937;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    /* Responsive adjustment for small screens */
    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr auto auto;
        grid-template-areas:
          "header"
          "nav"
          "main"
          "aside"
          "footer";
      }
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <header>Header Area</header>
    <nav>
      <h3>Left Sidebar / Nav</h3>
      <ul>
        <li>Dashboard</li>
        <li>Analytics</li>
        <li>Settings</li>
      </ul>
    </nav>
    <main>
      <h2>Main Content Area</h2>
      <p>This layout uses CSS Grid <code>grid-template-areas</code> to establish the classic 5-zone Holy Grail web page structure.</p>
    </main>
    <aside>
      <h3>Right Aside</h3>
      <p>Widgets, ads, or secondary information go here.</p>
    </aside>
    <footer>Footer Area &copy; 2026</footer>
  </div>

</body>
</html>
